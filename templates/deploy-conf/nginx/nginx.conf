user root;
worker_processes 4;
pid /run/nginx.pid;
worker_rlimit_nofile 65535;

events {
    worker_connections 20480;
}

http {
    include                mime.types;
    include                subconf/global.conf;
    default_type           application/octet-stream;
    include                subconf/log.conf;
    sendfile               on;
    keepalive_timeout      0;
    proxy_connect_timeout  10;
    proxy_read_timeout     180;
    proxy_send_timeout     180;
    tcp_nopush             on;
    client_max_body_size   1024M;
    proxy_buffering        on;
    proxy_intercept_errors on;
    charset                UTF-8;

    include subconf/geo.conf;
    include upstream/upstream.conf;
    include vhosts/*.conf;
}
