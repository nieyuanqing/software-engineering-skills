# <SERVICE_NAME> —— nginx 反向代理配置（dev 环境，无域名/HTTP）
#
# dev 是共享主机场景：不绑定真实域名，用 IP+端口直接访问，不需要 SSL 证书。
# test/prod 环境是各自独立的机器，域名+HTTPS 通过 scripts/apply-ssl.sh 单独申请证书。
#
# 端口约定（固定，不要随意更改，见 specs/deployment.md 第三节）：
#   - 对外监听 <NGINX_PORT>
#   - 后端 Spring Boot 应用只绑定 127.0.0.1:<APP_PORT>，不直接对外暴露，必须经本代理访问
#
# 部署方式：scripts/deploy.sh（默认 --env=dev）拷贝到
# /opt/soft/nginx/conf/vhosts/<SERVICE_NAME>.conf 并执行 nginx -s reload 生效。

server {
    listen       <NGINX_PORT>;
    server_name  127.0.0.1;
    charset      utf-8;

    client_max_body_size 1024M;

    # ── API 反向代理 → 后端 ────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:<APP_PORT>/api/;

        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 预留 SSE/流式输出不超时、不缓冲
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    # ── OpenAPI 文档 ────────────────────────────────────────────
    location /swagger-ui/ {
        proxy_pass       http://127.0.0.1:<APP_PORT>/swagger-ui/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    location /v3/api-docs {
        proxy_pass       http://127.0.0.1:<APP_PORT>/v3/api-docs;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    # ── 前端静态资源（可选，见 specs/deployment.md 第三节）────────
    # SPA 路由：静态文件命中就直接返回，其余 fallback 到 index.html 交给前端路由处理。
    # 如果本服务没有前端，删除此 location 块。
    location /web/ {
        alias /opt/soft/apps/<SERVICE_NAME>/web/;
        try_files $uri $uri/ /web/index.html;
    }
}
