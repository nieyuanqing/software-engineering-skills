# 通用 SSL 参数，按需在 server 块中 include subconf/ssl.conf。
# 证书路径为占位符 <DOMAIN>，使用前替换为实际证书的域名/文件名，证书文件放进 cert/ 目录
# （见 cert/README.md）。如果不同服务需要各自独立的证书，改为在各自 vhost 里单独声明
# ssl_certificate / ssl_certificate_key（见 templates/deploy-conf/nginx/vhosts/service.test.conf、
# vhosts/service.prod.conf），不 include 本文件的证书路径部分即可。
ssl_certificate     cert/<DOMAIN>.pem;
ssl_certificate_key cert/<DOMAIN>.key;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDH-RSA-AES128-GCM-SHA256:HIGH:!NULL:!aNULL:!MD5:!3DES:!ADH:!RC4:!DH:!DHE;
ssl_protocols TLSv1.2;
