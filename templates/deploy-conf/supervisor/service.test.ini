# <SERVICE_NAME> supervisord 程序配置（test 环境）
#
# 部署方式：scripts/deploy.sh --env=test 拷贝到 /etc/supervisor/conf.d/<SERVICE_NAME>.ini
# 并执行 supervisorctl reread/update/restart 生效，不在部署时用 heredoc 现场拼接。
[program:<SERVICE_NAME>]
command=/bin/bash -c "set -a; . /opt/soft/apps/<SERVICE_NAME>/.env; set +a; exec /usr/bin/java -jar /opt/soft/apps/<SERVICE_NAME>/<SERVICE_NAME>.jar --spring.profiles.active=test"
directory=/opt/soft/apps/<SERVICE_NAME>
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=30
stdout_logfile=/data/logs/apps/<SERVICE_NAME>/supervisord.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile=/data/logs/apps/<SERVICE_NAME>/supervisord.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
