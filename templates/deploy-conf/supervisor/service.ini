# <SERVICE_NAME> supervisord 程序配置
#
# 内容对 dev/test/prod 三套环境完全一样——三套环境是三台独立机器，各自固定相同端口，
# 每台机器上的本地路径（/opt/soft/apps/<SERVICE_NAME>、/data/logs/apps/<SERVICE_NAME>）都相同，
# 真正的环境差异（数据库连接、密钥）落在各主机自己的 /opt/soft/apps/<SERVICE_NAME>/.env 里，
# 不落在这份配置里，所以不需要三套变体，一份共用。
#
# 部署方式：由 scripts/deploy.sh 拷贝到 /etc/supervisor/conf.d/<SERVICE_NAME>.ini 并执行
# supervisorctl reread/update/restart 生效，不在部署时用 heredoc 现场拼接。
[program:<SERVICE_NAME>]
command=/bin/bash -c "set -a; . /opt/soft/apps/<SERVICE_NAME>/.env; set +a; exec /usr/bin/java -jar /opt/soft/apps/<SERVICE_NAME>/<SERVICE_NAME>.jar --spring.profiles.active=prod"
directory=/opt/soft/apps/<SERVICE_NAME>
autostart=true
autorestart=true
# startsecs 故意设得小：它只负责"进程有没有立即崩溃"（supervisorctl restart 会阻塞到
# startsecs 结束才返回）——真正判断"应用是否准备好接流量"交给 scripts/deploy.sh 的
# wait_for_health()。如果 startsecs 设得接近或超过应用真实启动耗时（Flyway 迁移/
# 连接池初始化等），健康检查会在 restart 已经等够的情况下第一次探测就通过，日志里的
# "耗时 N 秒"永远趋近 0——这不是 bug，是两层等待重叠了（见 specs/deployment-common.md 第六节规则 5）。
startsecs=3
startretries=3
stopwaitsecs=30
stdout_logfile=/data/logs/apps/<SERVICE_NAME>/supervisord.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile=/data/logs/apps/<SERVICE_NAME>/supervisord.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
