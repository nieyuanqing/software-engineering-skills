spring:
  application:
    name: <SERVICE_NAME>

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate        # 禁止自动建表/改表，由 Flyway 管理 schema 变更
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: <APP_PORT>
  address: 127.0.0.1            # 只绑本地，不直接对外暴露，由 nginx 反向代理

# 健康检查端点：统一暴露在 /api/<SERVICE_NAME>/health（见 specs/deployment-common.md 第六节）
# Spring Boot Actuator 通过 base-path 配置，不使用默认的 /actuator/health
management:
  endpoints:
    web:
      base-path: /api/<SERVICE_NAME>
      exposure:
        include: health
  endpoint:
    health:
      show-details: never       # 不暴露内部依赖详情给外部访问者
