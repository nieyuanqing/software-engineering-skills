# <SERVICE_NAME> —— nginx 站点配置（prod 环境，独立机器，域名 + HTTPS）
#
# 域名：<PROD_DOMAIN>（需要解析到这台 prod 机器）。
# 证书通过 scripts/apply-ssl.sh prod 申请（Let's Encrypt + acme.sh，HTTP-01 webroot 验证），
# 装到 /etc/nginx/ssl/<PROD_DOMAIN>.{pem,key}。证书缺失时 deploy.sh 会降级部署 dev 配置并告警。
#
# prod 是独立机器，不需要考虑与其他项目的端口冲突，但对外端口约定仍然保持
# <NGINX_PORT>（不改用标准 443），与 test 保持一致，方便三套环境的部署/排障方式统一。
# 80 端口只用于 ACME HTTP-01 验证 + 跳转到 <NGINX_PORT>，不承载业务流量。
#
# 部署方式：scripts/deploy.sh --target ssl --env prod 同步到
# $NGINX_CONF_DIR/<SERVICE_NAME>.conf 并 nginx -t + reload 生效。
#
# map/log_format/upstream 名称带 <SERVICE_NAME>_ 前缀，避免与同主机其他项目重名冲突。
#
# 与 test 配置的差异只有一处：生产环境由应用侧 SWAGGER_ENABLED=false 关掉 OpenAPI 文档，
# 下面的 /swagger-ui/ 与 /v3/api-docs 代理保留但会由后端返回空，不改 nginx 也无需改。

# ── CORS 统一在 nginx 层处理（后端服务不参与跨域）──────────────────
map $http_origin $<SERVICE_NAME>_cors_origin {
    default "";
    "https://<PROD_DOMAIN>" $http_origin;
    # 按需追加允许的前端来源（小程序/Android 请求无 Origin 头，不受本白名单影响）
}

# ── 访问日志：令牌脱敏，只记 Bearer 前 8 位 ────────────────────────
map $http_authorization $<SERVICE_NAME>_auth_log {
    default "-";
    "~^Bearer\s+([0-9a-zA-Z-]{8})" "Bearer $1...";
}

log_format <SERVICE_NAME>_access '$remote_addr $time_iso8601 "$request" $status $body_bytes_sent '
    'rt=$request_time urt=$upstream_response_time '
    'auth="$<SERVICE_NAME>_auth_log>" referer="$http_referer" ua="$http_user_agent"';

upstream <SERVICE_NAME>_backend {
    server 127.0.0.1:<APP_PORT>;
}

# 只用于 ACME HTTP-01 验证（apply-ssl.sh 的 --webroot），其余请求跳转到 <NGINX_PORT> HTTPS
server {
    listen 80;
    server_name <PROD_DOMAIN>;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    location / {
        return 301 https://$host:<NGINX_PORT>$request_uri;
    }
}

server {
    listen       <NGINX_PORT> ssl;
    server_name  <PROD_DOMAIN>;
    charset      utf-8;

    ssl_certificate     /etc/nginx/ssl/<PROD_DOMAIN>.pem;
    ssl_certificate_key /etc/nginx/ssl/<PROD_DOMAIN>.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /data/logs/nginx/<SERVICE_NAME>-access.log <SERVICE_NAME>_access;

    client_max_body_size 1024M;

    # ── CORS 响应头（来源命中白名单才回带，见文件顶部 map）──────────
    add_header Access-Control-Allow-Origin $<SERVICE_NAME>_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Request-Id, X-Client-Type" always;
    add_header Access-Control-Expose-Headers "Authorization, X-Request-Id" always;
    add_header Vary "Origin" always;

    # ── API 反向代理 → 后端 ────────────────────────────────────────
    location <API_PATH_PREFIX>/ {
        proxy_pass         http://<SERVICE_NAME>_backend/api/;

        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    # ── 长耗时接口单独放宽超时 / SSE 流式透传：见 dev 配置里的注释示例 ──

    # ── OpenAPI 文档（生产环境由应用侧 SWAGGER_ENABLED=false 关闭）───
    location /swagger-ui/ {
        proxy_pass       http://<SERVICE_NAME>_backend/swagger-ui/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    location /v3/api-docs {
        proxy_pass       http://<SERVICE_NAME>_backend/v3/api-docs;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    # ── 前端静态资源（可选，HAS_WEB=false 时删除本块）────────────────
    location <WEB_PATH>/ {
        alias /opt/soft/apps/<SERVICE_NAME>/web/;
        index index.html;
        try_files $uri $uri/ <WEB_PATH>/index.html;
        add_header Cache-Control "no-cache";
    }

    location ^~ <WEB_PATH>/_next/static/ {
        alias /opt/soft/apps/<SERVICE_NAME>/web/_next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
