# <SERVICE_NAME> —— nginx 站点配置（dev 环境，无域名/HTTP）
#
# dev 是共享主机场景：不绑定真实域名，用 IP+端口直接访问，不需要 SSL 证书。
# test/prod 环境是各自独立的机器，域名+HTTPS 通过 scripts/apply-ssl.sh 单独申请证书。
#
# 端口约定（固定，不要随意更改，见 specs/deployment.md 第三节）：
#   - 对外监听 <NGINX_PORT>
#   - 后端 Spring Boot 应用绑定 127.0.0.1:<APP_PORT>，不直接对外暴露，必须经本代理访问
#
# 部署方式：scripts/deploy.sh --target backend（默认 --env dev）同步到
# $NGINX_CONF_DIR/<SERVICE_NAME>.conf 并 nginx -t + reload 生效。
#
# 本文件会被单独拷到主机上，不依赖其它 include；map/log_format/upstream 名称
# 一律带 <SERVICE_NAME>_ 前缀，避免与同主机其他项目的站点配置重名冲突。

# ── CORS 统一在 nginx 层处理（后端服务不参与跨域）──────────────────
# 只回带白名单内的 Origin，未命中就不回带头——用 * 等于允许任意站点带着凭据跨域调用。
map $http_origin $<SERVICE_NAME>_cors_origin {
    default "";
    "~^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$" $http_origin;
    # 按需追加允许的前端来源，例如：
    # "https://admin.example.com" $http_origin;
}

# ── 访问日志：令牌脱敏，只记 Bearer 前 8 位 ────────────────────────
# 完整令牌落日志等于把凭证写进一堆人可读可备份的文件；前 8 位足够关联排查。
map $http_authorization $<SERVICE_NAME>_auth_log {
    default "-";
    "~^Bearer\s+([0-9a-zA-Z-]{8})" "Bearer $1...";
}

log_format <SERVICE_NAME>_access '$remote_addr $time_iso8601 "$request" $status $body_bytes_sent '
    'rt=$request_time urt=$upstream_response_time '
    'auth="$<SERVICE_NAME>_auth_log>" referer="$http_referer" ua="$http_user_agent"';

upstream <SERVICE_NAME>_backend {
    server 127.0.0.1:<APP_PORT>;
}

# ACME HTTP-01 证书验证入口（apply-ssl.sh 的 webroot）。三套环境配置里都保留这一段，
# 这样无论当前部署的是哪套配置，80 端口都能完成签发；其余 80 端口请求一律 404。
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    location / {
        return 404;
    }
}

server {
    listen       <NGINX_PORT>;
    server_name  _;
    charset      utf-8;

    access_log /data/logs/nginx/<SERVICE_NAME>-access.log <SERVICE_NAME>_access;

    # 上传/导入类请求体上限，按业务最大文件设置（默认 1m 会拒绝大文件）
    client_max_body_size 1024M;

    # ── CORS 响应头（来源命中白名单才回带，见文件顶部 map）──────────
    add_header Access-Control-Allow-Origin $<SERVICE_NAME>_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Request-Id, X-Client-Type" always;
    add_header Access-Control-Expose-Headers "Authorization, X-Request-Id" always;
    add_header Vary "Origin" always;

    # ── API 反向代理 → 后端 ────────────────────────────────────────
    # 健康检查即 <API_PATH_PREFIX>/health（应用内 /api/<SERVICE_NAME>/health），可直接经本代理访问。
    location <API_PATH_PREFIX>/ {
        proxy_pass         http://<SERVICE_NAME>_backend/api/;

        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    # ── 长耗时接口单独放宽超时（按需启用）──────────────────────────
    # nginx 默认 proxy_read_timeout 60s，比后端调用大模型的超时更短时会由网关先出 504，
    # 客户端拿到的是网关错误页而不是后端的可解析业务错误。给这类路由单开一个 location：
    # 超时值要「大于后端超时、小于客户端超时」，让失败以业务错误形态回到调用方。
    # location ~ ^<API_PATH_PREFIX>/ai/ {
    #     proxy_pass http://<SERVICE_NAME>_backend/api/;
    #     proxy_read_timeout 150s;
    #     proxy_send_timeout 150s;
    # }

    # ── SSE / 流式输出（按需启用）──────────────────────────────────
    # 逐块透传必须关缓冲并固定 Connection 为空，否则整段响应会被攒完才吐出：
    # location ~ ^<API_PATH_PREFIX>/chat/stream$ {
    #     proxy_pass http://<SERVICE_NAME>_backend/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection '';
    #     proxy_buffering off;
    #     proxy_cache off;
    #     chunked_transfer_encoding on;
    #     proxy_read_timeout 300s;
    #     gzip off;
    # }

    # ── OpenAPI 文档 ────────────────────────────────────────────────
    location /swagger-ui/ {
        proxy_pass       http://<SERVICE_NAME>_backend/swagger-ui/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    location /v3/api-docs {
        proxy_pass       http://<SERVICE_NAME>_backend/v3/api-docs;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    # ── 前端静态资源（可选，HAS_WEB=false 时删除本块）────────────────
    # 静态文件命中就直接返回，其余 fallback 到 index.html 交给前端路由处理。
    # HTML 入口不缓存（no-cache 仍会带 ETag 回源验证），否则发版后旧 HTML 引用的
    # 资源文件已被删除，页面会卡在白屏。
    location <WEB_PATH>/ {
        alias /opt/soft/apps/<SERVICE_NAME>/web/;
        index index.html;
        try_files $uri $uri/ <WEB_PATH>/index.html;
        add_header Cache-Control "no-cache";
    }

    # 带内容哈希的构建产物可以放心长缓存（文件名变了才会重新拉取）
    location ^~ <WEB_PATH>/_next/static/ {
        alias /opt/soft/apps/<SERVICE_NAME>/web/_next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # OPTIONS 预检直接返回，不进后端
    if ($request_method = OPTIONS) {
        return 204;
    }
}
