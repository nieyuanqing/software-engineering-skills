# <SERVICE_NAME> —— nginx 反向代理配置（prod 环境，独立机器，域名 + HTTPS）
#
# 域名：<PROD_DOMAIN>（需要解析到这台 prod 机器）。
# 证书通过 scripts/apply-ssl.sh prod 申请（Let's Encrypt + acme.sh，HTTP-01 webroot 验证）。
#
# test/prod 是各自独立的机器，不需要考虑与其他项目的端口冲突，但对外端口约定仍然保持
# <NGINX_PORT>（不改用标准 443），与 dev/test 保持一致，方便三套环境的部署/排障方式统一。
# 80 端口只用于 ACME HTTP-01 验证 + 跳转到 <NGINX_PORT>，不承载业务流量。
#
# 部署方式：scripts/deploy.sh --target ssl --env prod 同步到
# /etc/nginx/conf.d/<SERVICE_NAME>.conf 并执行 nginx reload 生效。

# 只用于 ACME HTTP-01 验证（scripts/apply-ssl.sh 的 --webroot），以及把误访问 80 的请求
# 跳转到正式的 <NGINX_PORT> HTTPS 端口；不代理任何业务路径。
server {
    listen 80;
    server_name <PROD_DOMAIN>;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    location / {
        return 301 https://$host:<NGINX_PORT>$request_uri;
    }
}

server {
    listen       <NGINX_PORT> ssl;
    server_name  <PROD_DOMAIN>;
    charset      utf-8;

    ssl_certificate     /etc/nginx/ssl/<PROD_DOMAIN>.pem;
    ssl_certificate_key /etc/nginx/ssl/<PROD_DOMAIN>.key;

    client_max_body_size 1024M;

    # ── API 反向代理 → 后端 ────────────────────────────────────
    location /<SERVICE_NAME>/api/ {
        proxy_pass         http://127.0.0.1:<APP_PORT>/api/;

        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    # ── OpenAPI 文档 ────────────────────────────────────────────
    location /swagger-ui/ {
        proxy_pass       http://127.0.0.1:<APP_PORT>/swagger-ui/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    location /v3/api-docs {
        proxy_pass       http://127.0.0.1:<APP_PORT>/v3/api-docs;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    # ── 前端静态资源（可选，见 specs/deployment.md 第三节）────────
    # 如果本服务没有前端，删除此 location 块。
    location /<SERVICE_NAME>/web/ {
        alias /opt/soft/apps/<SERVICE_NAME>/web/;
        try_files $uri $uri/ /<SERVICE_NAME>/web/index.html;
    }
}
