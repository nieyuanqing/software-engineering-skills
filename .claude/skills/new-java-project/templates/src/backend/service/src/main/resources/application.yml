# <SERVICE_NAME> 公共配置（三套环境共用；环境差异写在 application-<profile>.yml）
#
# 约定一：本文件被纳入版本管理，因此**不写任何真实凭证**。所有敏感项一律
#         `${环境变量:空默认}`，真值由 src/backend/<SERVICE_NAME>/.env* 注入。
# 约定二：端口/地址从环境变量取，默认值与 specs/deployment.md 登记的端口一致，
#         这样 `mvn spring-boot:run` 不带 .env 也能起来，但起来的是安全的本地默认。

server:
  port: ${SERVER_PORT:<APP_PORT>}
  # 只绑 127.0.0.1，对外访问必须经 nginx 反向代理；共享主机上直接绑 0.0.0.0
  # 等于把应用端口暴露在公网，绕过了 nginx 层的鉴权/限流/日志。
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: <SERVICE_NAME>

  # 时间字段统一按东八区输出。Jackson 默认把上下文时区按 UTC 归一，
  # 库内 16:26:02+08 会被序列化成 ...T08:26:02Z，前端按字符串截断展示就早了 8 小时。
  jackson:
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      # 默认 1MB 会直接拒掉手机拍照原图（10MB+）；按业务最大文件放开，
      # 且必须 ≤ nginx 站点的 client_max_body_size，否则大文件由网关先拒
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:200MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:210MB}

  jpa:
    hibernate:
      # 只校验不建表：结构归 Flyway 管，实体与库对不上就让启动失败，不让 Hibernate 顺手改结构
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # schema 变更只有一条路径：Flyway。迁移脚本 = 本模块 src/main/resources/db/migration/V<n>__<主题>.sql，
  # 随 jar 打包，应用启动时自动迁移到最新版本，跑到哪一版记在目标库自己的 flyway_schema_history 里。
  # 迁移失败 → 应用起不来 → scripts/deploy.sh 的健康检查判本次部署失败并中止，
  # 不会带着半套结构继续接流量（结构变更因此与代码是同一次原子落地，不存在"忘跑迁移"）。
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # 用 Flyway 接管一个已有结构的库：非空且没有 flyway_schema_history 时，默认行为是直接报错，
    # 这一位让它先补一条 baseline 记录再往下迁移
    baseline-on-migrate: true
    # baseline 记成 0 版，好让库里已有的 V1__ 脚本照常参与判定；设成 1（Flyway 默认）会连 V1 一起跳过
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true           # /actuator/health/liveness + /readiness
      show-details: never       # 不把内部依赖详情（DB/磁盘）暴露给访问者

# 健康检查端点统一为 /api/<SERVICE_NAME>/health（见 specs/deployment-common.md 第六节）。
# 该路径由 config/RootController.java 提供（同路径还返回服务说明），不走 Actuator 的
# base-path 改写：Actuator 保持在默认 /actuator/* 下，只用于本机排查。
# 部署脚本与 nginx 站点配置都按这个路径对接。
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha
