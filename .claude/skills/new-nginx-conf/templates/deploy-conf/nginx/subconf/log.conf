# 敏感请求头脱敏：Token / Authorization 不写入明文日志
map $http_token $masked_token {
    default "****";
    ""      "-";
}

map $http_authorization $masked_authorization {
    default "****";
    ""      "-";
}

# 标准公参访问日志格式
# 网络基础：remote_addr / server_addr / host / http_host / server_port / scheme / server_protocol / ssl_protocol
# 请求标识：request_id（链路追踪）/ x_forwarded_for（真实 IP 链）
# 请求细节：request / status / body_bytes_sent / request_length / request_body / upstream_status
# 设备与会话（均为请求头传入）：Device-Id → $http_device_id / userid → $http_userid / token → $masked_token（脱敏）
log_format main
    '$remote_addr $server_addr $host $http_host $server_port '
    '$scheme $server_protocol $ssl_protocol - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    '$request_id "$http_x_forwarded_for" '
    '$request_length "$request_body" $upstream_status '
    '$upstream_addr $request_time $upstream_response_time '
    '$http_device_id $http_userid $masked_token $masked_authorization';

access_log  logs/access.log  main;
error_log   logs/error.log   warn;
